<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/lobby/lobby.css" />
    <title>Lobby</title>
  </head>
  <body>
    <section class="player-profile">
      <img
        class="profile-picture"
        src="https://placehold.co/80x80"
        alt="Player Profile Picture"
      />

      <div class="player-info">
        <p class="username">{USERNAME}</p>

        <div class="stats">
          <p><strong>Wins:</strong> {WINS}</p>
          <p><strong>Losses:</strong> {LOSSES}</p>
        </div>
      </div>
    </section>
    <ul class="playerList"></ul>
    <table>
      <caption>
        Game Options
      </caption>
      <tbody>
        <tr>
          <th scope="row">Game Type</th>
          <td>
            <select name="gameType" id="gameType"></select>
          </td>
        </tr>
        <tr>
          <th scope="row">Multiplayer Type</th>
          <td>
            <select name="Multiplayer" id="multiplayer"></select>
          </td>
        </tr>
        <tr>
          <th scope="local">Game Mode</th>
          <td>
            <select name="gameStyle" id="gameStyle"></select>
          </td>
        </tr>
      </tbody>
    </table>
    <form id="startGameButton">
      <button type="submit">Start Game</button>
    </form>
    <div id="gameBoard"></div>
    <p id="errorBar"></p>
    <script type="module" src="/src/lobby/lobby.ts"></script>
  </body>
</html>
